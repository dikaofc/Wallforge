<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden;
    font-family:monospace;color:#6cf}
  #c{position:fixed;inset:0}
  h1{position:fixed;top:40%;width:100%;text-align:center;font-size:48px;
    text-shadow:0 0 18px #2d6cdf;margin:0}
</style></head>
<body>
  <canvas id="c"></canvas>
  <h1>WALLFORGE WEB</h1>
  <script>
    const c=document.getElementById('c'),x=c.getContext('2d');
    function r(){c.width=innerWidth;c.height=innerHeight}
    addEventListener('resize',r);r();
    let t=0;
    (function loop(){
      t+=0.02;
      x.fillStyle='rgba(10,10,18,0.25)';x.fillRect(0,0,c.width,c.height);
      for(let i=0;i<40;i++){
        const a=i/40*Math.PI*2, r=80+Math.sin(t+i)*40;
        x.fillStyle=`hsl(${i*9+t*20},80%,60%)`;
        x.beginPath();
        x.arc(c.width/2+Math.cos(a+t)*r,c.height/2+Math.sin(a+t)*r,3,0,7);
        x.fill();
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body></html>
